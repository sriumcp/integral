<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Integral · workspace inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Palette — warm paper, deep cool ink, single signal amber. */
    --paper:        oklch(0.985 0.004 85);
    --paper-2:      oklch(0.975 0.005 85);
    --paper-3:      oklch(0.955 0.006 82);
    --ink:          oklch(0.205 0.012 260);
    --ink-2:        oklch(0.34  0.010 260);
    --mute:         oklch(0.52  0.008 260);
    --mute-2:       oklch(0.68  0.006 260);
    --line:         oklch(0.88  0.006 80);
    --line-2:       oklch(0.93  0.005 80);

    --amber:        oklch(0.68 0.135 65);
    --amber-soft:   oklch(0.94 0.045 75);
    --sage:         oklch(0.58 0.07 155);
    --sage-soft:    oklch(0.94 0.025 150);
    --rose:         oklch(0.6  0.13 25);
    --rose-soft:    oklch(0.94 0.03 30);
    --blue:         oklch(0.55 0.08 245);
    --blue-soft:    oklch(0.94 0.025 245);

    --shadow-card:  0 1px 0 oklch(0.9 0.005 80 / 0.6);

    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --serif: "IBM Plex Serif", Georgia, serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #root { min-height: 100vh; }

  /* Reset button + a */
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* Utility classes used throughout components */
  .mono { font-family: var(--mono); font-feature-settings: "ss01", "cv02"; }
  .serif { font-family: var(--serif); }

  /* Selection */
  ::selection { background: var(--amber-soft); color: var(--ink); }

  /* Scrollbar restraint */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; border: 2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover { background: var(--mute-2); }

  /* Subtle 8px grid background for the map only — disabled by default, opt-in via class */
  .map-grid {
    background-image:
      linear-gradient(to right, oklch(0.92 0.005 80 / 0.5) 1px, transparent 1px),
      linear-gradient(to bottom, oklch(0.92 0.005 80 / 0.5) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
  }

  /* Subtle pulse for presence indicator */
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.25); }
  }
  .presence-dot { animation: pulse-dot 1.8s ease-in-out infinite; }

  /* Caret blink in shaping pane */
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  .caret { animation: blink 1.1s steps(1) infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="mock-data.js"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="surface-map.jsx"></script>
<script type="text/babel" src="surface-detail.jsx"></script>
<script type="text/babel" src="surface-shaping.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
